# SendFast synthetic data generator (PLAN.md Stage 3).
# Same seed + same config -> byte-identical raw data and answer key.
# SendFast is a fictional B2B cross-border payments API: revenue = monthly platform fee
# + usage fee (bps of volume) + FX margin (bps of cross-currency volume) + minimum-commit true-up.

seed: 20261031
as_of: 2026-10-31 # never now() (D11)
months: 24 # history: 2024-11-01 .. 2026-10-31
warmup_months: 12 # simulated before the window so customers already exist when it opens
scale: 1.0 # 1.0 = full; 0.1 = CI. Reps and FX don't scale; everything else does.

size: # at scale 1.0
  leads: 4000
  transactions: 500000 # target total, calibrated across all live accounts
  orphan_merchants: 3 # merchants that exist in the ledger but not in billing or the CRM

crm:
  hubspot_timezone: America/New_York # HubSpot raw timestamps are naive local wall-clock times
  new_company_share: 0.85 # a lead is for a new company; otherwise an existing one
  lead_sources: { inbound: 0.33, outbound: 0.25, paid: 0.25, partner: 0.17 }
  conversion_rate: { inbound: 0.34, outbound: 0.24, paid: 0.30, partner: 0.42 }
  segments: { smb: 0.55, mid_market: 0.30, enterprise: 0.15 }
  deal_size_median_usd: { smb: 14000, mid_market: 60000, enterprise: 220000 }
  deal_size_sigma: 0.6 # log-normal
  win_rate: { inbound: 0.45, outbound: 0.37, paid: 0.41, partner: 0.45 } # before story multipliers
  cycle_days_median: { smb: 35, mid_market: 60, enterprise: 105 }
  slip_rate: 0.30 # chance each of up to 3 slips happens
  stale_close_date_rate: 0.08 # open deal whose close date the rep never updated
  month_end_snap_rate: 0.35
  stage_skip_rate: 0.15
  stage_backward_rate: 0.08
  reopen_rate: 0.04

customers:
  live_delay: # days from won to go-live: a fast majority, a slow tail, and some never
    fast: { share: 0.70, median: 18, sigma: 0.5 }
    slow: { share: 0.25, median: 62, sigma: 0.35 }
    never_live_share: 0.05
  monthly_churn_hazard: { smb: 0.022, mid_market: 0.013, enterprise: 0.007 }
  early_life_days: 90 # hazard is highest in the first 90 days...
  early_life_multiplier: 3.0 # ...by this much
  contract_churn_share: 0.6 # the rest churn silently (stop transacting, keep the subscription)
  silent_reactivation_rate: 0.2
  expansion_rate: 0.30
  contraction_rate: 0.15
  pricing:
    fee_bps: { smb: 80, mid_market: 50, enterprise: 30 }
    fx_margin_bps: { smb: 60, mid_market: 40, enterprise: 25 }
    platform_fee_usd: { smb: 500, mid_market: 1500, enterprise: 5000 }
    min_commit_usd: { smb: 0, mid_market: 2500, enterprise: 12000 }

usage:
  plateau_rate_log_mean: { smb: 0.6, mid_market: 1.6, enterprise: 2.6 } # txns/day, before calibration
  plateau_rate_log_sigma: 1.0 # heavy tail: top 10% of accounts carry most of the volume
  ticket_usd_median: { smb: 1500, mid_market: 5000, enterprise: 15000 }
  ramp_midpoint_days: 45 # S-curve after go-live
  ramp_width_days: 15
  weekday_factor: [1.15, 1.15, 1.15, 1.15, 1.10, 0.35, 0.20] # Mon..Sun
  payday_days: [1, 25, 26, 27, 28]
  payday_factor: 1.4
  december_factor: 1.3
  reversal_rate: 0.004
  corridors: # source-dest: payout rails and their shares
    USD-NGN: { nip: 0.7, swift: 0.3 }
    GBP-NGN: { nip: 0.8, swift: 0.2 }
    EUR-NGN: { swift: 1.0 }
    USD-KES: { mpesa: 0.6, swift: 0.4 }
    GBP-KES: { mpesa: 1.0 }
    USD-GHS: { swift: 1.0 }
    USD-ZAR: { swift: 1.0 }
    USD-INR: { swift: 1.0 }
    EUR-EUR: { sepa: 1.0 }
    GBP-GBP: { fps: 1.0 }
    USD-USD: { ach: 1.0 }
  failure_rate:
    {
      nip: 0.040,
      mpesa: 0.030,
      swift: 0.055,
      sepa: 0.010,
      fps: 0.008,
      ach: 0.015,
    }
  dispute_rate: 0.0015 # per succeeded transaction
  return_rate: { ach: 0.004, sepa: 0.003, default: 0.001 }

fx: # USD -> quote, daily. Annualised volatility.
  start:
    {
      GBP: 0.79,
      EUR: 0.92,
      NGN: 1550,
      KES: 129,
      GHS: 15.5,
      ZAR: 18.2,
      INR: 84.0,
    }
  volatility:
    {
      GBP: 0.08,
      EUR: 0.07,
      NGN: 0.15,
      KES: 0.06,
      GHS: 0.12,
      ZAR: 0.15,
      INR: 0.04,
    }
  devaluation: { currency: NGN, date: 2025-06-16, step: 0.40 } # one-day 40% jump

dirty: # each type is counted in the answer key
  currency_variant_rate: 0.008 # NGN written as `ngn` or `₦` in the ledger
  duplicate_contact_rate: 0.03 # same person again, email in different case
  test_account_rate: 0.012 # "Test ..." accounts
  internal_account_rate: 0.008 # SendFast's own domain
  close_before_create_rate: 0.02 # share of deals; at least 2 closed-lost deals get a close date before creation
  null_lead_source_rate: 0.06
  missing_billing_ref_rate: 0.15 # won accounts with no Stripe id on the CRM record...
  unmatchable_rate: 0.02 # ...of which some have no domain either, so they can't be matched

stories: # PLAN.md Stage 3 planted stories; each has an answer key entry
  corridor_spike:
    { corridor: USD-NGN, rail: nip, month: 2026-03, failure_rate: 0.22 }
  partner_leads: # lower win rate, but bigger referred companies that transact more
    win_rate_multiplier: 0.55
    volume_multiplier: 3.0
    churn_hazard_multiplier: 0.5 # referred customers stick
    segments: { smb: 0.25, mid_market: 0.45, enterprise: 0.30 }
  pricing_change_cohort:
    cohort: 2025Q1 # accounts that went live in this quarter...
    change_date: 2025-09-01 # ...get a price rise on this date...
    platform_fee_multiplier: 1.6
    fee_bps_increase: 12
    churn_hazard_multiplier: 6.0 # ...and churn faster afterwards
    price_shock_churn_rate: 0.45 # ...and this share leaves within ~4 months of the rise
  slipping_rep:
    {
      rep: 5,
      pipeline_weight: 2.5,
      win_rate_multiplier: 0.6,
      slip_rate: 0.85,
      stale_close_date_rate: 0.65,
    }
  concentration: { volume_share: 0.30 } # one enterprise customer carries ~30% of TPV
  slow_activation: { threshold_days: 45, churn_hazard_multiplier: 4.0 }
