# Local synthetic stack. Every host, port, name and credential comes from env (.env).
# Image tags are pinned on purpose (D2).
#
# The `prod` profile (PLAN.md Stage 0) is deliberately not defined yet. It only has
# something to run once the conformance CLI exists (Stage 8), and it is human-only (D12).

name: ${COMPOSE_PROJECT_NAME:-sendfast}

services:
  postgres-data:
    image: postgres:17.11-alpine # matches Supabase Cloud's Postgres 17 line (Section 2A, rule 2)
    environment:
      POSTGRES_DB: ${DATA_DB_NAME:?set in .env}
      POSTGRES_USER: ${DATA_DB_ADMIN_USER:?set in .env}
      POSTGRES_PASSWORD: ${DATA_DB_ADMIN_PASSWORD:?set in .env}
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"] # UTC everywhere
    ports:
      - "${DATA_DB_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
