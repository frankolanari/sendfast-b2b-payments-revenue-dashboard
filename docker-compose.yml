# Local synthetic stack. Every host, port, name and credential comes from env (.env).
# Image tags are pinned on purpose (D2): Metabase API behaviour changes between versions.
#
# The `prod` profile (PLAN.md Stage 0) is deliberately not defined yet. It only has
# something to run once the conformance CLI exists (Stage 8), and it is human-only (D12).

name: ${COMPOSE_PROJECT_NAME:-sendfast}

services:
  postgres-data:
    image: postgres:17.11-alpine # matches Supabase Cloud's Postgres 17 line (Section 2A, rule 2)
    environment:
      POSTGRES_DB: ${DATA_DB_NAME:?set in .env}
      POSTGRES_USER: ${DATA_DB_ADMIN_USER:?set in .env}
      POSTGRES_PASSWORD: ${DATA_DB_ADMIN_PASSWORD:?set in .env}
    ports:
      - "${DATA_DB_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-metabase:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${MB_APP_DB_NAME:?set in .env}
      POSTGRES_USER: ${MB_APP_DB_USER:?set in .env}
      POSTGRES_PASSWORD: ${MB_APP_DB_PASSWORD:?set in .env}
    volumes:
      - postgres-metabase:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  metabase:
    image: metabase/metabase:v0.64.8.3 # open-source edition, v0.64 LTS line
    depends_on:
      postgres-metabase:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres-metabase
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${MB_APP_DB_NAME}
      MB_DB_USER: ${MB_APP_DB_USER}
      MB_DB_PASS: ${MB_APP_DB_PASSWORD}
      MB_SITE_URL: ${MB_SITE_URL:?set in .env}
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
    ports:
      - "${MB_HOST_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:3000/api/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  postgres-data:
  postgres-metabase:
