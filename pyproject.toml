[project]
name = "sendfast-b2b-payments-revenue-dashboard"
version = "0.0.0"
description = "Synthetic-first revenue dashboard for SendFast, a fictional B2B cross-border payments API."
requires-python = ">=3.12,<3.13"
dependencies = [
  "dbt-core==1.12.7",
  "dbt-postgres==1.11.0",
  "jsonschema==4.26.0",
  "numpy==2.5.4",
  "pandas==3.1.1",
  "pyyaml==6.0.4",
]

[dependency-groups]
dev = [
    "matplotlib==3.11.2",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["scripts/tests", "generator/tests"]
pythonpath = ["scripts", "generator/src"]
addopts = "--strict-markers"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
