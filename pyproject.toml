[project]
name = "sendfast-b2b-payments-revenue-dashboard"
version = "0.0.0"
description = "Synthetic-first revenue dashboard for SendFast, a fictional B2B cross-border payments API."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pre-commit==4.7.0"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
