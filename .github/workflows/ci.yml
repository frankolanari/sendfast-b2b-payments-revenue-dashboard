# The CI jobs are the gates (PLAN.md Section 5). Jobs for later stages are added as each stage starts.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0 # no moving major tag published
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: make lint

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the full history, not just the last commit
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --no-banner

  contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version-bump rule compares against the base commit
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: contract valid, dictionary current, changelog entry, version bumped on change
        env:
          # PRs compare with the target branch; pushes to main compare with the previous commit.
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: make contract-check BASE_REF="$BASE_REF"

  unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make test

  generator:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: committed answer keys equal a fresh computation (scale 1.0 and 0.1)
        run: make answer-keys-check
      - name: every planted story is detectable in the raw tables (full scale)
        run: make stories

  integration:
    needs: unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine # same pin as docker-compose.yml; the image defaults to UTC
        env:
          POSTGRES_DB: sendfast
          POSTGRES_USER: sendfast_admin
          POSTGRES_PASSWORD: synthetic-local-only
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U sendfast_admin -d sendfast"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: synthetic-local-only # synthetic CI database only (D12)
      PSQL: psql -h localhost -p 55432 -U sendfast_admin -d sendfast
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: sudo apt-get install -y --no-install-recommends postgresql-client
      - run: cp .env.example .env
      - name: generate synthetic data (scale 0.1)
        run: make generate SCALE=0.1
      - name: compile maps, apply roles, dbt build (all tests)
        run: make transform CRM=hubspot
      - name: golden numbers (answer key vs marts, scale 0.1 key)
        run: make golden SCALE=0.1
      - name: dbt docs (lineage)
        run: make dbt-docs
      - uses: actions/upload-artifact@v7
        with:
          name: dbt-docs
          path: |
            dbt/target/index.html
            dbt/target/manifest.json
            dbt/target/catalog.json

  compiled-up-to-date:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: committed staging models equal a fresh compile of the map
        run: make compiled-check CRM=hubspot
      - name: compiling is idempotent
        run: make compile-idempotent CRM=hubspot && git diff --exit-code
      - name: dbt parses the project (sources, refs, generated tests)
        run: make dbt-parse
