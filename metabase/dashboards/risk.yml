# Page 3 (D10): account health and risk. Accounts link through to Account 360.
name: Account health & risk
collection: Risk
description: Failures by corridor, revenue at risk, concentration and disputes.
parameters: [date_from, date_to, segment, corridor, owner_id]
cards:
  - { card: Failure rate, row: 0, col: 0, size_x: 8, size_y: 3 }
  - { card: Revenue at risk (USD), row: 0, col: 8, size_x: 8, size_y: 3 }
  - {
      card: Top-10 revenue concentration,
      row: 0,
      col: 16,
      size_x: 8,
      size_y: 3,
    }
  - card: Failure rate by corridor and month
    row: 3
    col: 0
    size_x: 16
    size_y: 7
    crossfilter: { corridor: corridor }
  - { card: Accounts by health status, row: 3, col: 16, size_x: 8, size_y: 7 }
  - card: Volume and failure rate by corridor
    row: 10
    col: 0
    size_x: 12
    size_y: 7
    crossfilter: { corridor: corridor }
  - {
      card: Dispute and return rate by month,
      row: 10,
      col: 12,
      size_x: 12,
      size_y: 7,
    }
  - card: Accounts at risk
    row: 17
    col: 0
    size_x: 12
    size_y: 8
    link:
      {
        dashboard: Account 360,
        column: account_name,
        parameters: { account_id: account_id },
      }
  - card: Top 10 accounts by net revenue
    row: 17
    col: 12
    size_x: 12
    size_y: 8
    link: { dashboard: Account 360, parameters: { account_id: account_id } }
