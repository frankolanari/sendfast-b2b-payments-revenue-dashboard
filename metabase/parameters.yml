# The shared parameter contract (PLAN.md Stage 6). Every card takes a subset of these, with the
# same names and types; every dashboard filter is one of these. scripts/metabase_bootstrap.py
# refuses a card or dashboard that uses anything else. Stage 7's proxy passes the same names.
#
# type: date -> native `date` tag, dashboard `date/single`; text -> native `text` tag,
# dashboard `string/=`. Defaults are fixed dates (D11: never now()): the trailing 12 months.
# values: a static list (segment and lead source come from the schema contract's allowed
# values, plus `unknown`), or a card in the "Filter values" collection.

version: 1
parameters:
  date_from:
    type: date
    label: From
    default: "2025-11-01"
  date_to:
    type: date
    label: To
    default: "2026-10-31"
  segment:
    type: text
    label: Segment
    values: { static: [smb, mid_market, enterprise] }
  lead_source:
    type: text
    label: Lead source
    values: { static: [inbound, outbound, paid, partner, unknown] }
  owner_id:
    type: text
    label: Rep
    values: { card: "Filter values: reps", value: rep_id, label: rep_name }
  corridor:
    type: text
    label: Corridor
    values: { card: "Filter values: corridors", value: corridor }
  account_id:
    type: text
    label: Account
    default: "10000006" # the largest customer: Account 360 needs an account to show
    values:
      {
        card: "Filter values: accounts",
        value: account_id,
        label: account_name,
      }
