# Collections the bootstrap creates (by name, top level). Cards and dashboards name one of these.
collections:
  - name: Pipeline
    description: Pipeline and funnel questions (dashboard page 1).
  - name: Revenue
    description: Revenue, retention and activation (dashboard page 2).
  - name: Risk
    description: Account health and risk (dashboard page 3).
  - name: Accounts
    description: Account 360, the drill target (dashboard page 4).
  - name: Models
    description: Metabase models on the key marts, for ad-hoc exploration by analysts.
  - name: Filter values
    description: Small cards that feed dashboard filter dropdowns.
  - name: Golden numbers
    description: One card per golden metric, generated from metrics/metrics.yml. Do not edit by hand.
