# Schema contract: the canonical staging model (PLAN.md Stage 1).
# The only thing both synthetic and production data must satisfy.
# Any semantic change needs a version bump and a CHANGELOG.md entry (`make contract-check`).
# contract/data_dictionary.md is generated from this file: never edit it by hand.

contract_version: 2.0.0

conventions:
  - All timestamps are `timestamptz` in UTC. Dates are calendar dates in UTC.
  - All money is in major units (`numeric`), always paired with an ISO 4217 `currency` column, unless the column name ends in `_usd`. Raw minor units are converted in staging.
  - Currency codes are upper-case ISO 4217 (`NGN`, never `ngn` or `₦`).
  - Identifiers are `text`, unique within their table, and stable across reloads.
  - Enum columns use only the listed allowed values. Source values are mapped in staging (CRM via `mappings/crm/*.yml`).
  - Test and internal records are kept in staging and flagged downstream, not dropped here.

tables:
  # ── CRM (source-agnostic; generated by the mapping compiler) ─────────────
  - name: stg_crm__users
    source: crm
    description: CRM users who own accounts and opportunities (sales reps and managers).
    grain: one row per CRM user
    primary_key: [user_id]
    columns:
      - {
          name: user_id,
          type: text,
          nullable: false,
          description: CRM user identifier.,
        }
      - { name: name, type: text, nullable: false, description: Display name. }
      - name: team
        type: text
        nullable: true
        description: Sales team the user belongs to.
        allowed_values: [smb, mid_market, enterprise, partnerships]
      - {
          name: active,
          type: boolean,
          nullable: false,
          description: Whether the user is currently active in the CRM.,
        }

  - name: stg_crm__accounts
    source: crm
    description: Companies in the CRM, prospects and customers alike.
    grain: one row per CRM account
    primary_key: [account_id]
    columns:
      - {
          name: account_id,
          type: text,
          nullable: false,
          description: CRM account identifier.,
        }
      - {
          name: name,
          type: text,
          nullable: false,
          description: Company name as entered in the CRM (variants such as "Acme Ltd" vs "ACME Limited" are possible).,
        }
      - {
          name: domain,
          type: text,
          nullable: true,
          description: "Lower-case web domain without scheme or `www.`. Used for identity matching.",
        }
      - {
          name: industry,
          type: text,
          nullable: true,
          description: Free-text industry.,
        }
      - {
          name: country,
          type: text,
          nullable: true,
          pattern: "^[A-Z]{2}$",
          description: ISO 3166-1 alpha-2 country code.,
        }
      - name: segment
        type: text
        nullable: true
        description: Customer segment.
        allowed_values: [smb, mid_market, enterprise]
      - {
          name: owner_id,
          type: text,
          nullable: true,
          description: CRM user who owns the account.,
        }
      - {
          name: created_at,
          type: timestamptz,
          nullable: false,
          description: When the account was created in the CRM.,
        }
      - {
          name: billing_customer_ref,
          type: text,
          nullable: true,
          description: "Billing (Stripe) customer id stored on the CRM account, when present. Missing for some won accounts, which are then matched by domain.",
        }
    foreign_keys:
      - {
          columns: [owner_id],
          references: { table: stg_crm__users, columns: [user_id] },
        }

  - name: stg_crm__contacts
    source: crm
    description: People at accounts.
    grain: one row per CRM contact
    primary_key: [contact_id]
    columns:
      - {
          name: contact_id,
          type: text,
          nullable: false,
          description: CRM contact identifier.,
        }
      - {
          name: account_id,
          type: text,
          nullable: true,
          description: "Account the contact belongs to, if associated.",
        }
      - {
          name: email,
          type: text,
          nullable: true,
          description: "Email address as stored (case not normalised here; duplicates by case are possible).",
        }
      - { name: title, type: text, nullable: true, description: Job title. }
      - {
          name: created_at,
          type: timestamptz,
          nullable: false,
          description: When the contact was created.,
        }
    foreign_keys:
      - {
          columns: [account_id],
          references: { table: stg_crm__accounts, columns: [account_id] },
        }

  - name: stg_crm__leads
    source: crm
    description: Inbound and outbound leads, before and after conversion.
    grain: one row per lead
    primary_key: [lead_id]
    columns:
      - {
          name: lead_id,
          type: text,
          nullable: false,
          description: CRM lead identifier.,
        }
      - {
          name: contact_id,
          type: text,
          nullable: true,
          description: Contact the lead belongs to.,
        }
      - {
          name: account_id,
          type: text,
          nullable: true,
          description: Account the lead was matched or converted to.,
        }
      - name: lead_source
        type: text
        nullable: true
        description: Canonical lead source. Null when the CRM has none.
        allowed_values: [inbound, outbound, paid, partner]
      - {
          name: created_at,
          type: timestamptz,
          nullable: false,
          description: When the lead was created.,
        }
      - {
          name: converted_at,
          type: timestamptz,
          nullable: true,
          description: When the lead converted to an opportunity. Null if not converted.,
        }
    foreign_keys:
      - {
          columns: [contact_id],
          references: { table: stg_crm__contacts, columns: [contact_id] },
        }
      - {
          columns: [account_id],
          references: { table: stg_crm__accounts, columns: [account_id] },
        }

  - name: stg_crm__opportunities
    source: crm
    description: Sales opportunities (deals).
    grain: one row per opportunity, current state
    primary_key: [opportunity_id]
    columns:
      - {
          name: opportunity_id,
          type: text,
          nullable: false,
          description: CRM opportunity identifier.,
        }
      - {
          name: account_id,
          type: text,
          nullable: false,
          description: Account the opportunity is for.,
        }
      - {
          name: owner_id,
          type: text,
          nullable: true,
          description: CRM user who owns the opportunity.,
        }
      - {
          name: amount_usd,
          type: numeric,
          nullable: true,
          description: "Expected first-year contract value in USD, major units.",
        }
      - {
          name: created_at,
          type: timestamptz,
          nullable: false,
          description: When the opportunity was created.,
        }
      - {
          name: close_date,
          type: date,
          nullable: true,
          description: "Expected close date when open, actual close date when closed. Can be earlier than created_at in dirty data.",
        }
      - name: stage
        type: text
        nullable: false
        description: Canonical current stage.
        allowed_values: [discovery, qualified, proposal, negotiation, won, lost]
      - {
          name: is_closed,
          type: boolean,
          nullable: false,
          description: "True when stage is won or lost.",
        }
      - {
          name: is_won,
          type: boolean,
          nullable: false,
          description: "True when stage is won.",
        }
      - name: lead_source
        type: text
        nullable: true
        description: Canonical lead source of the opportunity.
        allowed_values: [inbound, outbound, paid, partner]
    foreign_keys:
      - {
          columns: [account_id],
          references: { table: stg_crm__accounts, columns: [account_id] },
        }
      - {
          columns: [owner_id],
          references: { table: stg_crm__users, columns: [user_id] },
        }

  - name: stg_crm__opportunity_stage_history
    source: crm
    description: Every stage an opportunity entered, including skips, backward moves and reopens.
    grain: one row per opportunity per stage entry
    primary_key: [opportunity_id, entered_at, stage]
    optional: true # a CRM map may declare `supported: false`; the table then exists, typed and empty
    columns:
      - {
          name: opportunity_id,
          type: text,
          nullable: false,
          description: Opportunity whose stage changed.,
        }
      - name: stage
        type: text
        nullable: false
        description: Canonical stage entered.
        allowed_values: [discovery, qualified, proposal, negotiation, won, lost]
      - {
          name: entered_at,
          type: timestamptz,
          nullable: false,
          description: When the opportunity entered the stage.,
        }
    foreign_keys:
      - {
          columns: [opportunity_id],
          references:
            { table: stg_crm__opportunities, columns: [opportunity_id] },
        }

  # ── Billing (Stripe-shaped source; hand-written staging) ─────────────────
  - name: stg_billing__customers
    source: billing
    description: Billing customers (Stripe customers).
    grain: one row per billing customer
    primary_key: [customer_id]
    columns:
      - {
          name: customer_id,
          type: text,
          nullable: false,
          description: "Billing customer id (Stripe `cus_...`).",
        }
      - {
          name: name,
          type: text,
          nullable: true,
          description: Customer name on the billing account.,
        }
      - { name: email, type: text, nullable: true, description: Billing email. }
      - {
          name: created_at,
          type: timestamptz,
          nullable: false,
          description: When the customer was created in billing.,
        }

  - name: stg_billing__subscriptions
    source: billing
    description: Platform-fee subscriptions (the monthly fixed fee).
    grain: one row per subscription
    primary_key: [subscription_id]
    columns:
      - {
          name: subscription_id,
          type: text,
          nullable: false,
          description: "Subscription id (Stripe `sub_...`).",
        }
      - {
          name: customer_id,
          type: text,
          nullable: false,
          description: Billing customer on the subscription.,
        }
      - name: status
        type: text
        nullable: false
        description: Subscription status.
        allowed_values: [trialing, active, past_due, unpaid, canceled]
      - {
          name: monthly_amount,
          type: numeric,
          nullable: false,
          description: "Monthly platform fee, major units.",
        }
      - {
          name: currency,
          type: text,
          nullable: false,
          pattern: "^[A-Z]{3}$",
          description: Currency of the fee.,
        }
      - {
          name: started_at,
          type: timestamptz,
          nullable: false,
          description: When the subscription started.,
        }
      - {
          name: canceled_at,
          type: timestamptz,
          nullable: true,
          description: When cancellation was requested.,
        }
      - {
          name: ended_at,
          type: timestamptz,
          nullable: true,
          description: "When the subscription ended (contract churn date).",
        }
    foreign_keys:
      - {
          columns: [customer_id],
          references: { table: stg_billing__customers, columns: [customer_id] },
        }

  - name: stg_billing__invoices
    source: billing
    description: Invoices issued to billing customers.
    grain: one row per invoice
    primary_key: [invoice_id]
    columns:
      - {
          name: invoice_id,
          type: text,
          nullable: false,
          description: "Invoice id (Stripe `in_...`).",
        }
      - {
          name: customer_id,
          type: text,
          nullable: false,
          description: Billing customer invoiced.,
        }
      - {
          name: subscription_id,
          type: text,
          nullable: true,
          description: "Subscription the invoice belongs to, if any.",
        }
      - name: status
        type: text
        nullable: false
        description: Invoice status.
        allowed_values: [draft, open, paid, void, uncollectible]
      - {
          name: currency,
          type: text,
          nullable: false,
          pattern: "^[A-Z]{3}$",
          description: Invoice currency.,
        }
      - {
          name: total,
          type: numeric,
          nullable: false,
          description: "Invoice total, major units.",
        }
      - {
          name: amount_paid,
          type: numeric,
          nullable: false,
          description: "Amount paid so far, major units.",
        }
      - {
          name: period_start,
          type: timestamptz,
          nullable: false,
          description: Start of the billed period.,
        }
      - {
          name: period_end,
          type: timestamptz,
          nullable: false,
          description: End of the billed period.,
        }
      - {
          name: created_at,
          type: timestamptz,
          nullable: false,
          description: When the invoice was created.,
        }
    foreign_keys:
      - {
          columns: [customer_id],
          references: { table: stg_billing__customers, columns: [customer_id] },
        }
      - {
          columns: [subscription_id],
          references:
            { table: stg_billing__subscriptions, columns: [subscription_id] },
        }

  - name: stg_billing__invoice_lines
    source: billing
    description: Invoice line items. Usage and FX-margin revenue is computed from the ledger, not from these lines.
    grain: one row per invoice line
    primary_key: [invoice_line_id]
    columns:
      - {
          name: invoice_line_id,
          type: text,
          nullable: false,
          description: "Invoice line id (Stripe `il_...`).",
        }
      - {
          name: invoice_id,
          type: text,
          nullable: false,
          description: Invoice the line belongs to.,
        }
      - name: line_type
        type: text
        nullable: false
        description: "Canonical line type: the monthly platform fee, or the minimum-commit true-up."
        allowed_values: [platform_fee, usage_true_up]
      - {
          name: amount,
          type: numeric,
          nullable: false,
          description: "Line amount, major units.",
        }
      - {
          name: currency,
          type: text,
          nullable: false,
          pattern: "^[A-Z]{3}$",
          description: Line currency.,
        }
      - {
          name: period_start,
          type: timestamptz,
          nullable: false,
          description: Start of the period the line covers.,
        }
      - {
          name: period_end,
          type: timestamptz,
          nullable: false,
          description: End of the period the line covers.,
        }
    foreign_keys:
      - {
          columns: [invoice_id],
          references: { table: stg_billing__invoices, columns: [invoice_id] },
        }

  # ── Ledger (the payments platform's own database) ────────────────────────
  - name: stg_ledger__merchants
    source: ledger
    description: Merchants on the payments platform.
    grain: one row per merchant
    primary_key: [merchant_id]
    columns:
      - {
          name: merchant_id,
          type: text,
          nullable: false,
          description: Ledger merchant identifier.,
        }
      - {
          name: billing_customer_id,
          type: text,
          nullable: true,
          description: Billing customer linked to the merchant. Null for orphaned merchants.,
        }
      - {
          name: legal_name,
          type: text,
          nullable: false,
          description: Registered legal name.,
        }
      - {
          name: domain,
          type: text,
          nullable: true,
          description: "Lower-case web domain without scheme or `www.`.",
        }
      - {
          name: live_at,
          type: timestamptz,
          nullable: true,
          description: When the merchant went live. Null if never live.,
        }

  - name: stg_ledger__transactions
    source: ledger
    description: Payment transactions processed for merchants.
    grain: one row per transaction
    primary_key: [transaction_id]
    columns:
      - {
          name: transaction_id,
          type: text,
          nullable: false,
          description: Ledger transaction identifier.,
        }
      - {
          name: merchant_id,
          type: text,
          nullable: false,
          description: Merchant that sent the payment.,
        }
      - {
          name: created_at,
          type: timestamptz,
          nullable: false,
          description: When the transaction was created.,
        }
      - name: status
        type: text
        nullable: false
        description: Final transaction status.
        allowed_values: [succeeded, failed, reversed]
      - name: rail
        type: text
        nullable: false
        description: Payment rail used for the payout leg.
        allowed_values: [swift, sepa, ach, fps, nip, mpesa]
      - {
          name: source_currency,
          type: text,
          nullable: false,
          pattern: "^[A-Z]{3}$",
          description: Currency the sender paid in.,
        }
      - {
          name: dest_currency,
          type: text,
          nullable: false,
          pattern: "^[A-Z]{3}$",
          description: Currency the beneficiary received.,
        }
      - {
          name: corridor,
          type: text,
          nullable: false,
          pattern: "^[A-Z]{3}-[A-Z]{3}$",
          description: "`<source_currency>-<dest_currency>`, e.g. `USD-NGN`.",
        }
      - {
          name: amount,
          type: numeric,
          nullable: false,
          description: "Transaction amount in `currency`, major units.",
        }
      - {
          name: currency,
          type: text,
          nullable: false,
          pattern: "^[A-Z]{3}$",
          description: Currency of `amount` (the source currency).,
        }
      - name: failure_reason
        type: text
        nullable: true
        description: Why the transaction failed. Null unless status is failed.
        allowed_values:
          [
            insufficient_funds,
            compliance_hold,
            beneficiary_bank_reject,
            invalid_account,
            rail_timeout,
            fx_quote_expired,
          ]
    foreign_keys:
      - {
          columns: [merchant_id],
          references: { table: stg_ledger__merchants, columns: [merchant_id] },
        }

  - name: stg_ledger__disputes
    source: ledger
    description: Disputes and payment returns raised against transactions, typically 30 to 90 days later.
    grain: one row per dispute or return
    primary_key: [dispute_id]
    columns:
      - {
          name: dispute_id,
          type: text,
          nullable: false,
          description: Ledger dispute identifier.,
        }
      - {
          name: transaction_id,
          type: text,
          nullable: false,
          description: Transaction disputed or returned.,
        }
      - name: dispute_type
        type: text
        nullable: false
        description: "`dispute` is raised by the sender; `return` is the beneficiary bank sending funds back."
        allowed_values: [dispute, return]
      - {
          name: opened_at,
          type: timestamptz,
          nullable: false,
          description: When the dispute or return was opened.,
        }
      - {
          name: resolved_at,
          type: timestamptz,
          nullable: true,
          description: When it was resolved. Null while open.,
        }
      - name: outcome
        type: text
        nullable: true
        description: "Resolution from SendFast's side. Null while open."
        allowed_values: [won, lost]
      - {
          name: amount,
          type: numeric,
          nullable: false,
          description: "Amount disputed or returned, major units.",
        }
      - {
          name: currency,
          type: text,
          nullable: false,
          pattern: "^[A-Z]{3}$",
          description: Currency of `amount`.,
        }
    foreign_keys:
      - {
          columns: [transaction_id],
          references:
            { table: stg_ledger__transactions, columns: [transaction_id] },
        }

  # ── Rates ────────────────────────────────────────────────────────────────
  - name: stg_rates__fx_rates
    source: rates
    description: Daily FX rates. One unit of base_currency equals `rate` units of quote_currency.
    grain: one row per date per currency pair
    primary_key: [rate_date, base_currency, quote_currency]
    columns:
      - {
          name: rate_date,
          type: date,
          nullable: false,
          description: Date the rate applies to.,
        }
      - {
          name: base_currency,
          type: text,
          nullable: false,
          pattern: "^[A-Z]{3}$",
          description: Base currency.,
        }
      - {
          name: quote_currency,
          type: text,
          nullable: false,
          pattern: "^[A-Z]{3}$",
          description: Quote currency.,
        }
      - {
          name: rate,
          type: numeric,
          nullable: false,
          description: Quote units per one base unit. Always positive.,
        }
      - {
          name: source,
          type: text,
          nullable: false,
          description: Where the rate came from.,
        }

  - name: stg_rates__pricing_rates
    source: rates
    description: Per-customer pricing with effective dates, kept with billing. A renegotiation adds a new row; it never edits an old one.
    grain: one row per billing customer per pricing period
    primary_key: [billing_customer_id, effective_from]
    columns:
      - {
          name: billing_customer_id,
          type: text,
          nullable: false,
          description: Billing customer the pricing applies to.,
        }
      - {
          name: fee_bps,
          type: numeric,
          nullable: false,
          description: "Usage fee in basis points of USD volume.",
        }
      - {
          name: fx_margin_bps,
          type: numeric,
          nullable: false,
          description: "FX margin in basis points, applied to cross-currency volume.",
        }
      - {
          name: platform_fee_usd,
          type: numeric,
          nullable: false,
          description: "Monthly platform fee in USD.",
        }
      - {
          name: min_commit_usd,
          type: numeric,
          nullable: false,
          description: "Monthly minimum revenue commitment in USD; shortfall is billed as a true-up. 0 if none.",
        }
      - {
          name: effective_from,
          type: date,
          nullable: false,
          description: First date the pricing applies (inclusive).,
        }
      - {
          name: effective_to,
          type: date,
          nullable: true,
          description: Last date the pricing applies (inclusive). Null while current.,
        }
    foreign_keys:
      - {
          columns: [billing_customer_id],
          references: { table: stg_billing__customers, columns: [customer_id] },
        }
